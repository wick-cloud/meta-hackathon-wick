# Pin together with Trivy v0.76.1. These are its complete built-in path allow rules.
# Shipped tests, examples, dependency metadata, and system files must also be scanned.
# No application secret or image path is suppressed here.
disable-allow-rules:
  - dist-info
  - tests
  - examples
  - vendor
  - usr-dirs
  - locale-dir
  - markdown
  - node.js
  - golang
  - python
  - rubygems
  - wordpress
  - anaconda-log
