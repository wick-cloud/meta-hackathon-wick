services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: wick_broker
      POSTGRES_USER: wick
      POSTGRES_PASSWORD: wick_local_only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - wick-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wick -d wick_broker"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  wick-postgres:
