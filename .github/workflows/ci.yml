name: Offline broker checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: wick
          POSTGRES_PASSWORD: wick_ci_only
          POSTGRES_DB: wick_broker
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U wick -d wick_broker"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://wick:wick_ci_only@localhost:5432/wick_broker
      TEST_DATABASE_URL: postgresql://wick:wick_ci_only@localhost:5432/wick_broker_test
      BETTER_AUTH_SECRET: ci-only-auth-secret-not-for-any-real-environment
      WICK_MODE: fixture
      MUSE_MODE: fixture
      APP_URL: http://localhost:3000
      E2E_BASE_URL: http://localhost:3000
      SEED_BUYER_EMAIL: buyer@demo.wick.local
      SEED_SUPPLIER_A_EMAIL: supplier-a@demo.wick.local
      SEED_SUPPLIER_B_EMAIL: supplier-b@demo.wick.local
      SEED_SUPPLIER_C_EMAIL: supplier-c@demo.wick.local
      SEED_ADMIN_EMAIL: admin@demo.wick.local
      SEED_BUYER_PASSWORD: ci-buyer-only-password
      SEED_SUPPLIER_A_PASSWORD: ci-supplier-a-only-password
      SEED_SUPPLIER_B_PASSWORD: ci-supplier-b-only-password
      SEED_SUPPLIER_C_PASSWORD: ci-supplier-c-only-password
      SEED_ADMIN_PASSWORD: ci-admin-only-password
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
        env:
          FORMAT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      - run: npm run audit
      - run: npm run test:static
      - run: PGPASSWORD=wick_ci_only createdb -h localhost -U wick wick_broker_test
      - run: npm run typecheck
      - run: |
          npm test -- --reporter=default --reporter=json --outputFile=/tmp/broker-unit-results.json
          node scripts/check-test-results.mjs vitest /tmp/broker-unit-results.json
      - run: npm run build
      - run: npm run security:secrets
      - run: npm run db:seed
      - run: npm run test:recovery
      - name: Restore with client tools matching the PostgreSQL 16 test server
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client-16
          PATH="/usr/lib/postgresql/16/bin:$PATH" npm run test:restore
      - run: npx playwright install --with-deps chromium
      - run: |
          INFERENCE_MARKET_MODE=fixture node dist/src/server/index.js > /tmp/wick-broker.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; wait "$server_pid" || true' EXIT
          ready=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:3000/ready; then ready=true; break; fi
            sleep 1
          done
          if [ "$ready" != true ]; then echo 'Fixture application did not become ready.' >&2; exit 1; fi
          RUN_INFERENCE_E2E=1 PLAYWRIGHT_JSON_OUTPUT_FILE=/tmp/broker-browser-results.json npm run test:browser -- --reporter=list,json
          node scripts/check-test-results.mjs playwright /tmp/broker-browser-results.json
      - name: Verify the real Linux guest sandbox with fixture inference
        run: |
          docker build -f tests/fixtures/coding-linux.Dockerfile -t wick-broker-coding-local:bookworm .
          CODING_TEST_DOCKER_CONTEXT=default npm run test:coding-local
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
          retention-days: 7
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install pinned Semgrep
        run: |
          python3 -m venv /tmp/broker-semgrep
          /tmp/broker-semgrep/bin/pip install --disable-pip-version-check semgrep==1.183.0
      - name: Scan application security boundaries
        run: /tmp/broker-semgrep/bin/semgrep scan --config .semgrep.yml --metrics=off --disable-version-check --error
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.76.1
      - name: Verify secret-scan redaction and failure handling
        run: node --test tests/image-secret-scanner.test.mjs
      - name: Build and verify the production container
        run: bash scripts/verify-container.sh
