version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      npm-dependencies:
        patterns: ['*']
      npm-security:
        applies-to: security-updates
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      github-actions:
        patterns: ['*']
      github-actions-security:
        applies-to: security-updates
        patterns: ['*']
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      docker-images:
        patterns: ['*']
      docker-security:
        applies-to: security-updates
        patterns: ['*']
